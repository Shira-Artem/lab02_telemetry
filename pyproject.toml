[project]
name = "lab02-telemetry"
version = "1.0.0"
description = "Лабораторная работа № 2: сбор и анализ игровой телеметрии"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2.2,<4",
    "matplotlib>=3.8,<4", "streamlit>=1.40,<2", "requests>=2.32,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analysis*", "client*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
